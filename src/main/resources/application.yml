spring:
  application:
    name: rezerv-business
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:business_db}
    username: ${DB_USERNAME:rezerv}
    password: ${DB_PASSWORD:rezerv}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
